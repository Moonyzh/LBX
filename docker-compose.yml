services:
  # ---------------------------------------------------------------------------
  # Lab 1B: three DHT nodes. Each machine starts ONLY its own node, because one
  # per machine binds 19001 on the host:
  #   machine A: docker compose up -d dht-node-a pricing trip
  #   machine B: docker compose up -d dht-node-b
  #   machine C: docker compose up -d dht-node-c
  # Node ids and predecessor ids are fixed so the ring is A -> B -> C -> A.
  # Successor addresses come from config/dht-node-<x>.cvm.yaml, generated by
  # scripts/dht-gen-config.sh from the three reachable IPs.
  # ---------------------------------------------------------------------------
  dht-node-a:
    image: lab1-ride-microservices:local
    container_name: dht-node-a
    command:
      - /app/dht_server
      - --config=/app/config/dht-node-a.cvm.yaml
      - --node_name=node-a
      - --node_id=0x10000000
      - --predecessor_id=0xB0000000
      - --successor_service=trpc.dht.node-b.DhtService
    ports:
      - "19001:19001"
    volumes:
      - ../config:/app/config:ro
    networks: [ridenet]

  dht-node-b:
    image: lab1-ride-microservices:local
    container_name: dht-node-b
    command:
      - /app/dht_server
      - --config=/app/config/dht-node-b.cvm.yaml
      - --node_name=node-b
      - --node_id=0x60000000
      - --predecessor_id=0x10000000
      - --successor_service=trpc.dht.node-c.DhtService
    ports:
      - "19001:19001"
    volumes:
      - ../config:/app/config:ro
    networks: [ridenet]

  dht-node-c:
    image: lab1-ride-microservices:local
    container_name: dht-node-c
    command:
      - /app/dht_server
      - --config=/app/config/dht-node-c.cvm.yaml
      - --node_name=node-c
      - --node_id=0xB0000000
      - --predecessor_id=0x60000000
      - --successor_service=trpc.dht.node-a.DhtService
    ports:
      - "19001:19001"
    volumes:
      - ../config:/app/config:ro
    networks: [ridenet]

  pricing:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lab1-ride-microservices:local
    command: ["/app/pricing_server", "--config=/app/config/pricing-service.yaml"]
    ports:
      - "18001:8000"
    networks: [ridenet]

  trip:
    image: lab1-ride-microservices:local
    command: ["/app/trip_server", "--config=/app/config/trip-service.yaml"]
    ports:
      - "18002:8000"
    depends_on: [pricing, dht-node-a]
    networks: [ridenet]

  client:
    image: lab1-ride-microservices:local
    profiles: ["tools"]
    networks: [ridenet]

networks:
  ridenet:
    driver: bridge

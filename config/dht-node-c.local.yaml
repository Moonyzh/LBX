global:
  threadmodel:
    default:
      - instance_name: default_instance
        io_handle_type: separate
        io_thread_num: 2
        handle_thread_num: 4

server:
  app: dht
  server: node-c
  admin_ip: 127.0.0.1
  admin_port: 18083
  service:
    - name: trpc.dht.node-c.DhtService
      protocol: trpc
      network: tcp
      ip: 127.0.0.1
      port: 19003

client:
  service:
    - name: trpc.dht.node-a.DhtService
      target: 127.0.0.1:19001
      protocol: trpc
      network: tcp
      conn_type: long
      is_conn_complex: true
      selector_name: domain

plugins:
  log:
    default:
      - name: default
        sinks:
          local_file:
            filename: /tmp/dht-node-c.log
